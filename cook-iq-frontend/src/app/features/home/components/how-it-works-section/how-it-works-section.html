<section class="hiw" id="how-it-works">
  <div class="hiw__inner">

    <div class="hiw-label" data-reveal>How it works</div>
    <h2 class="hiw-title" data-reveal>
      From fridge to fork<br>in <em>3 steps.</em>
    </h2>

    <div class="hiw-steps">
      <!-- Self-drawing SVG connector (desktop only) -->
      <svg class="hiw-connector" id="hiw-connector" viewBox="0 0 600 12" preserveAspectRatio="none" aria-hidden="true">
        <path d="M 0 6 Q 150 0 300 6 Q 450 12 600 6" id="connector-path" />
      </svg>

      <div *ngFor="let step of steps; let i = index" class="hiw-step" data-reveal
        [style.transition-delay]="i * 0.15 + 's'">
        <div class="step-num">{{ step.step }}</div>
        <h3 class="step-title">{{ step.title }}</h3>
        <p class="step-desc">{{ step.desc }}</p>
        <p class="step-detail">{{ step.detail }}</p>
      </div>
    </div>

  </div>
</section>
