<section class="cta">
  <div class="cta-liquid"></div>
  <div class="cta__grain"></div>

  <div class="cta__inner">
    <div class="cta-badge" data-reveal> {{ cta.badge }}</div>
    <h2 class="cta-title" data-reveal>
      {{ cta.title }}
    </h2>
    <p class="cta-sub" data-reveal>
      {{ cta.subtitle }}
    </p>
    <div class="cta-actions" data-reveal>
      <a href="#" class="btn btn-spice"> {{ cta.primaryBtn }}</a>
      <a href="#" class="btn btn-outline-light"> {{ cta.secondaryBtn }}</a>
    </div>
  </div>
</section>
